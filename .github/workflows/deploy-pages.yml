# Builds the Next.js site in web/ as a static export and publishes it to the
# `gh-pages` branch. GitHub Pages is set to "Deploy from a branch" → gh-pages / (root).
# Only the web/ app is deployed; frontend/ and backend/ are not used.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Served from https://<owner>.github.io/<repo>/ — change both if a custom domain is added.
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      # Demo deployment: keep it out of search engines. Remove when the site goes live.
      NEXT_PUBLIC_NOINDEX: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Stop GitHub Pages' Jekyll step from dropping the _next/ folder.
      - run: touch out/.nojekyll

      - name: Publish out/ to the gh-pages branch
        working-directory: web/out
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
